<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex  예제</title>
    <style>
        .container {
            display: flex;
            flex-direction: row; /* 아이템을 가로로 */
            /* flex-direction: column; /* 아이템을 세로로 */
            gap: 16px;
            justify-content: flex-start;
            justify-content: space-between;
            justify-content: space-around;
            justify-content: center;
        }
        .box {
            width: 100px;
            height: 100px;
            background-color: lightcoral;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
