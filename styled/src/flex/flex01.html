<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex  예제</title>
    <style>
        .container {
            display: flex;
            flex-direction: row; /* 아이템을 가로로 */
            /* flex-direction: column; /* 아이템을 세로로 */
            gap: 16px;
            /* 주축의 정렬 방법 */
            justify-content: flex-start; /* 가로방향 시작위치에 정렬 */
            justify-content: space-between; /* 가로방향 양끝 정렬*/
            justify-content: space-around; /* 가로방향 고르게 분배 */
            justify-content: center; /* 가운데방향 가운데 정렬 */
        }
        .box {
            width: 100px;
            height: 100px;
            background-color: lightcoral;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
