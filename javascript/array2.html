<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열 생성 예제</title>
</head>
<body>

    <script>
        // 배열의 길이가 4인 정수형 배열 생성
        let numders = new Array(4);
        // {null, null, null, null}
        // console.log(numders);
        // 배열에 값 할당
        numders[0] = 10;
        numders[1] = 20;
        numders[2] = 30;
        numders[3] = 40;
        
        // for문 사용한 전체 출력
        for(let i=0; i<numders.length; i++) {
            console.log(numders[i]);
        }
        

    </script>
    
</body>
</html>
